<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>메타인지 어원 단어장 (중등 고난도 1~8강)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 기본 폰트 및 앱 스타일 */
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; overflow: hidden; }
        
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        /* 아코디언 애니메이션 */
        .accordion-content { transition: max-height 0.3s ease-in-out, padding 0.3s ease-in-out, opacity 0.3s ease-in-out; max-height: 0; opacity: 0; overflow: hidden; }
        .accordion-content.open { max-height: 400px; opacity: 1; padding-top: 1rem; padding-bottom: 1rem; }
        
        /* 플래시카드 3D 애니메이션 */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flip-card-inner { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }

        /* 모바일 사이드바 트랜지션 */
        #sidebar { transition: transform 0.3s ease-in-out; }
        @media (max-width: 768px) {
            #sidebar { transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
        }

        /* 활성화된 사이드바 메뉴 스타일 */
        .menu-item.active { background-color: #eff6ff; color: #3b82f6; border-right: 4px solid #3b82f6; font-weight: 700; }
    </style>
</head>
<body class="flex h-screen w-full relative text-slate-800">

    <!-- 모바일 사이드바 오버레이 -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900 bg-opacity-50 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- 왼쪽 사이드바 (메뉴) -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-64 bg-white border-r border-slate-200 z-50 flex flex-col h-full shadow-2xl md:shadow-none flex-shrink-0">
        <!-- 사이드바 헤더 -->
        <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
            <h1 class="text-lg font-black text-slate-800 tracking-tight"><i class="fa-solid fa-graduation-cap text-blue-600 mr-2"></i>통합 단어장</h1>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-500 hover:text-slate-800"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        
        <!-- 사이드바 메뉴 리스트 -->
        <div class="flex-1 overflow-y-auto py-4" id="menuContainer">
            <!-- JS 렌더링 영역 -->
        </div>
    </aside>

    <!-- 오른쪽 메인 콘텐츠 영역 -->
    <main class="flex-1 flex flex-col h-full relative min-w-0">
        
        <!-- 상단 앱 헤더 -->
        <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md z-20">
            <div class="flex items-center">
                <!-- 햄버거 메뉴 -->
                <button onclick="toggleSidebar()" class="md:hidden mr-4 text-white hover:text-blue-200 transition">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <div>
                    <h2 id="currentLessonTitle" class="text-lg font-bold">학습할 단원을 선택하세요</h2>
                    <p id="currentBookTitle" class="text-xs text-blue-200 mt-0.5">왼쪽 메뉴를 열어주세요</p>
                </div>
            </div>
            <!-- 카드 모드 토글 -->
            <button onclick="toggleFlashcardMode()" id="modeToggleBtn" class="bg-blue-800 bg-opacity-50 text-white px-3 py-1.5 rounded-full text-sm font-semibold shadow-sm hover:bg-blue-700 transition hidden">
                <i class="fa-solid fa-clone mr-1"></i> 카드모드
            </button>
        </header>

        <!-- 리스트 뷰 영역 -->
        <div id="listView" class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-50 space-y-4 pb-24">
            <!-- 초기 안내 화면 -->
            <div class="flex flex-col items-center justify-center h-full text-slate-400">
                <i class="fa-solid fa-book-open text-6xl mb-4 text-slate-200"></i>
                <p class="font-medium text-lg">사이드바에서 단원을 선택해주세요.</p>
            </div>
        </div>

        <!-- 플래시카드 뷰 영역 -->
        <div id="flashcardView" class="hidden absolute inset-0 bg-slate-900 bg-opacity-95 z-30 flex-col pb-10 pt-16">
            <!-- 플래시카드 헤더 -->
            <div class="flex justify-between items-center px-6 pb-4 text-white">
                <span id="flashcardCounter" class="text-sm font-bold bg-slate-800 px-4 py-1.5 rounded-full border border-slate-600 text-blue-300 shadow-inner">0 / 0</span>
                <button onclick="toggleFlashcardMode()" class="text-slate-400 hover:text-white transition transform hover:rotate-90"><i class="fa-solid fa-xmark text-3xl"></i></button>
            </div>

            <!-- 카드 본체 -->
            <div class="flex-1 flex items-center justify-center p-6 w-full perspective-1000">
                <div id="flashcard" class="w-full h-[65vh] max-w-sm relative transform-style-3d flip-card-inner cursor-pointer" onclick="flipCard()">
                    
                    <!-- 앞면 (단어) -->
                    <div class="absolute inset-0 w-full h-full bg-white rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] backface-hidden flex flex-col justify-center items-center p-8 text-center border-b-8 border-blue-500">
                        <span id="cardGroup" class="absolute top-6 text-xs font-bold text-blue-600 bg-blue-100 px-3 py-1 rounded-full">그룹</span>
                        <h2 id="cardWord" class="text-4xl font-black text-slate-800 mb-4 tracking-tight break-words">Word</h2>
                        <p class="text-slate-400 text-sm mt-8 font-semibold animate-pulse"><i class="fa-solid fa-hand-pointer mr-2"></i>탭하여 뜻/어원 확인</p>
                    </div>

                    <!-- 뒷면 (뜻, 어원, 동계어) -->
                    <div class="absolute inset-0 w-full h-full bg-slate-800 rounded-3xl shadow-2xl backface-hidden rotate-y-180 flex flex-col p-6 text-white overflow-y-auto border border-slate-700">
                        <h2 id="cardWordBack" class="text-2xl font-bold mb-3 border-b border-slate-600 pb-2 text-blue-300">Word</h2>
                        <p id="cardMeaning" class="text-xl font-black mb-4 text-white">의미</p>
                        
                        <div class="bg-slate-900 bg-opacity-80 rounded-xl p-4 shadow-inner mb-3">
                            <p class="text-[0.7rem] text-emerald-400 mb-1 font-bold uppercase tracking-wider"><i class="fa-solid fa-seedling mr-1"></i> 메타인지 어원</p>
                            <p id="cardRoot" class="text-[0.85rem] leading-relaxed text-slate-300 font-medium break-keep">어원 설명</p>
                        </div>

                        <div class="bg-slate-900 bg-opacity-80 rounded-xl p-4 shadow-inner">
                            <p class="text-[0.7rem] text-blue-400 mb-1 font-bold uppercase tracking-wider"><i class="fa-solid fa-link mr-1"></i> 동계어 (Family)</p>
                            <p id="cardCognates" class="text-[0.85rem] font-medium text-slate-400">동계어</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 네비게이션 버튼 -->
            <div class="flex justify-center items-center space-x-8 px-6 pb-4">
                <button onclick="prevCard()" class="w-16 h-16 rounded-full bg-slate-700 text-white flex justify-center items-center active:bg-slate-600 hover:bg-slate-600 transition border border-slate-600 shadow-lg">
                    <i class="fa-solid fa-chevron-left text-2xl"></i>
                </button>
                <button onclick="nextCard()" class="w-16 h-16 rounded-full bg-blue-600 text-white flex justify-center items-center active:bg-blue-500 hover:bg-blue-500 transition shadow-[0_0_20px_rgba(37,99,235,0.4)] font-bold">
                    <i class="fa-solid fa-chevron-right text-2xl"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        // -------------------------------------------------------------
        // 통합 데이터베이스 (중등 고난도 1~8강)
        // -------------------------------------------------------------
        const database = {
            "중등 고난도": {
                "1강 (가족/관계)": [
                    { word: "lifespan", meaning: "일생, 생애", root: "life(생명) + span(뼘, 길이) → 생명이 지속되는 길이.", cognates: "span(기간, 폭)", group: "생애와 관계" },
                    { word: "daycare center", meaning: "탁아소, 보육원", root: "day(낮) + care(돌봄) + center(중심) → 낮 동안 돌봐주는 곳.", cognates: "careful(조심하는)", group: "생애와 관계" },
                    { word: "act", meaning: "행동하다, 처신하다", root: "agere(행하다, 움직이다).", cognates: "action(행동), active(활동적인)", group: "행동과 태도" },
                    { word: "communication", meaning: "연락, 의사소통", root: "com(함께) + mun(의무, 선물) → 함께 나누고 교환하는 것.", cognates: "community(공동체)", group: "생애와 관계" },
                    { word: "be engaged in", meaning: "~에 종사하다", root: "en(안에) + gage(서약하다) → 어떤 일에 매여 있는 상태.", cognates: "engage(약혼하다, 관여하다)", group: "행동과 태도" },
                    { word: "resemblance", meaning: "닮은 점, 유사점", root: "re(다시) + sembler(보이다) → 다시 보아도 비슷하게 보임.", cognates: "resemble(~와 닮다)", group: "생애와 관계" },
                    { word: "raise", meaning: "~을 기르다, 양육하다", root: "고대 노르드어 reisa (들어 올리다) → 아이가 자라도록 위로 끌어올림.", cognates: "rise(오르다)", group: "생애와 관계" },
                    { word: "destiny", meaning: "운명, 숙명", root: "de(완전히) + stinare(세우다) → 완전히 확고하게 정해져 세워진 것.", cognates: "destination(목적지)", group: "생애와 관계" },
                    { word: "interact with", meaning: "~와 상호 작용을 하다", root: "inter(서로, 사이에) + act(행동하다).", cognates: "interaction(상호작용)", group: "행동과 태도" },
                    { word: "nephew", meaning: "조카 (아들)", root: "라틴어 nepos (손자, 조카).", cognates: "nepotism(족벌주의)", group: "생애와 관계" },
                    { word: "treatment", meaning: "취급; 치료", root: "tractare(끌다, 다루다) + ment.", cognates: "treat(다루다), retreat(후퇴하다)", group: "행동과 태도" },
                    { word: "pregnancy", meaning: "임신", root: "pre(이전에) + gnasci(태어나다) → 출산 이전의 상태.", cognates: "pregnant(임신한)", group: "생애와 관계" },
                    { word: "obedience", meaning: "복종", root: "ob(~을 향해) + audire(듣다) → 향해서 귀 기울여 듣고 따름.", cognates: "obedient(순종적인), audio(소리)", group: "행동과 태도" },
                    { word: "support", meaning: "지지하다, 옹호하다; 지지", root: "sub(아래에서) + port(나르다) → 아래에서 떠받치다.", cognates: "export(수출하다)", group: "행동과 태도" },
                    { word: "parent", meaning: "부모", root: "parere(낳다) → 아이를 낳은 사람.", cognates: "parental(부모의)", group: "생애와 관계" },
                    { word: "marriage partner", meaning: "배우자", root: "marry(결혼하다) + partner(동반자).", cognates: "marry(결혼하다)", group: "생애와 관계" },

                    { word: "fatal", meaning: "치명적인; 운명의", root: "fatum(운명) + al → 죽음이라는 피할 수 없는 운명을 가져오는.", cognates: "fate(운명)", group: "생애와 관계" },

                    { word: "immature", meaning: "미숙한, 미발달의", root: "im(아닌) + mature(성숙한).", cognates: "mature(성숙한)", group: "생애와 관계" },
                    { word: "come into contact with", meaning: "~와 접촉하다", root: "con(함께) + tact(만지다) → 함께 닿다.", cognates: "contact(접촉)", group: "행동과 태도" },
                    { word: "advice", meaning: "충고", root: "ad(~쪽으로) + vis(보다) → 상대방 쪽을 보고 의견을 말해줌.", cognates: "advise(충고하다)", group: "행동과 태도" },
                    { word: "older", meaning: "나이가 위인", root: "old(나이든)의 비교급.", cognates: "old(늙은)", group: "생애와 관계" },
                    { word: "commemorate", meaning: "기념하다", root: "com(함께) + memor(기억하다) → 다 함께 기억하고 축하하다.", cognates: "memory(기억)", group: "생애와 관계" },
                    { word: "interaction", meaning: "상호 작용", root: "inter(서로) + action(행동).", cognates: "interact(상호작용하다)", group: "행동과 태도" },
                    { word: "senior", meaning: "연장자, 선배", root: "라틴어 senex(늙은)의 비교급 → 더 나이 든 사람.", cognates: "senate(상원)", group: "생애와 관계" },
                    { word: "escort", meaning: "동행하다", root: "ex(밖으로) + corrigere(올바르게 하다) → 밖에서 길을 올바르게 안내하다.", cognates: "-", group: "행동과 태도" },
                    { word: "celebration", meaning: "기념, 축하", root: "celebrare(사람이 많이 모이다) → 모여서 축하함.", cognates: "celebrate(축하하다)", group: "생애와 관계" },
                    { word: "bring up", meaning: "양육하다, 키우다", root: "bring(가져오다) + up(위로) → 아이를 위로(크게) 끌어올림.", cognates: "-", group: "생애와 관계" },
                    { word: "engagement", meaning: "약혼; 약속", root: "engage(약속하다) + ment.", cognates: "engage(약혼하다)", group: "생애와 관계" },
                    { word: "bond", meaning: "관계, 유대", root: "bind(묶다)의 명사형 → 묶여 있는 상태.", cognates: "bind(묶다)", group: "생애와 관계" },
                    { word: "take after", meaning: "~와 닮다", root: "take(취하다) + after(뒤를 이어) → 조상의 특징을 뒤이어 취하다.", cognates: "-", group: "생애와 관계" },
                    { word: "deal with", meaning: "다루다, 대우하다", root: "deal(나누다, 거래하다) + with.", cognates: "deal(거래)", group: "행동과 태도" },
                    { word: "touch", meaning: "접촉", root: "고대 프랑스어 tochier(치다, 만지다).", cognates: "touching(감동적인)", group: "행동과 태도" }
                ],
                "2강 (성격/외모)": [
                    { word: "brilliant idea", meaning: "훌륭한 생각", root: "brillare(빛나다) → 머릿속에서 반짝이는 생각.", cognates: "brilliant(빛나는)", group: "성격과 태도" },
                    { word: "arrogance", meaning: "오만, 거만", root: "ad(~에게) + rogare(요구하다) → 남에게 당연하듯 요구하는 무례한 태도.", cognates: "arrogant(거만한)", group: "성격과 태도" },
                    { word: "form", meaning: "모양, 꼴", root: "forma(형태).", cognates: "formal(공식적인)", group: "외모와 형태" },
                    { word: "elegance", meaning: "우아함", root: "e(밖으로) + legere(고르다) → 세심하게 골라낸 듯한 품격.", cognates: "elegant(우아한)", group: "성격과 태도" },
                    { word: "activity", meaning: "활동", root: "act(행동하다) + ivity.", cognates: "active(활동적인)", group: "성격과 태도" },
                    { word: "passive", meaning: "소극적인, 수동적인", root: "pati(고통받다, 인내하다) → 스스로 행동하지 않고 참는.", cognates: "passion(열정 - 인내하는 마음에서 파생)", group: "성격과 태도" },
                    { word: "lively", meaning: "적극적인, 생기 넘치는", root: "live(살다) + ly → 살아있는 것처럼 활기찬.", cognates: "alive(살아있는)", group: "성격과 태도" },
                    { word: "lazy", meaning: "게으른", root: "고대 프랑스어 lasche(나른한).", cognates: "-", group: "성격과 태도" },
                    { word: "individuality", meaning: "개성", root: "in(나눌 수 없는) + divid(나누다) → 나뉠 수 없는 고유한 특성.", cognates: "individual(개인의)", group: "성격과 태도" },
                    { word: "impatience", meaning: "성급함", root: "im(아닌) + patience(인내).", cognates: "patient(참을성 있는)", group: "성격과 태도" },
                    { word: "boldness", meaning: "배짱, 대담함", root: "bold(대담한) + ness.", cognates: "bold(대담한)", group: "성격과 태도" },
                    { word: "glittering", meaning: "빛나는", root: "glit(빛나다, 반짝이다).", cognates: "glitter(반짝이다)", group: "외모와 형태" },
                    { word: "egg-shaped", meaning: "타원형의", root: "egg(달걀) + shaped(모양의).", cognates: "-", group: "외모와 형태" },
                    { word: "charming", meaning: "매력적인", root: "charm(매력, 마법) + ing → 마법에 걸린 듯 마음을 끄는.", cognates: "charm(매력)", group: "외모와 형태" },
                    { word: "positive", meaning: "자신만만한, 긍정적인", root: "ponere(놓다) → 확고하게 자리를 잡고 있는.", cognates: "position(위치)", group: "성격과 태도" },
                    { word: "attract", meaning: "끌어당기다, 매혹하다", root: "ad(~로) + tract(끌다).", cognates: "attractive(매력적인)", group: "성격과 태도" },

        let currentCardIndex = 0;     // 현재 플래시카드 인덱스
        let isFlipped = false;        // 플래시카드 뒤집힘 상태
        let globalWordIndex = 0;      // 아코디언 고유 ID 카운터

        // 사이드바 메뉴 렌더링 함수
        function renderMenu() {
            const menuContainer = document.getElementById('menuContainer');
            let menuHTML = '';

            for (const book in database) {
                menuHTML += `
                    <div class="mb-6">
                        <h3 class="text-[11px] font-black text-slate-400 mb-2 px-5 uppercase tracking-widest">${book}</h3>
                        <ul class="space-y-0.5">
                `;
                
                for (const lesson in database[book]) {
                    const safeId = `menu-${book.replace(/\s+/g, '')}-${lesson.replace(/[^a-zA-Z0-9가-힣]/g, '')}`;
                    menuHTML += `
                        <li>
                            <button id="${safeId}" onclick="loadLesson('${book}', '${lesson}', '${safeId}')" 
                                class="menu-item w-full text-left px-5 py-2.5 text-sm text-slate-600 font-medium hover:bg-slate-100 transition flex items-center group">
                                <i class="fa-solid fa-chevron-right text-[9px] mr-3 opacity-30 group-hover:opacity-70 group-hover:translate-x-1 transition-all"></i>
                                ${lesson}
                            </button>
                        </li>
                    `;
                }
                menuHTML += `</ul></div>`;
            }
            menuContainer.innerHTML = menuHTML;
        }

        // 특정 단원 로드 함수
        function loadLesson(book, lesson, menuId) {
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            document.getElementById(menuId).classList.add('active');

            document.getElementById('currentLessonTitle').innerText = lesson;
            document.getElementById('currentBookTitle').innerText = book;
            document.getElementById('modeToggleBtn').classList.remove('hidden');

            currentFlatList = database[book][lesson];
            currentCardIndex = 0; 
            globalWordIndex = 0;  

            if(window.innerWidth < 768) {
                toggleSidebar();
            }
            renderList();
        }

        // 아코디언 리스트 렌더링 함수
        function renderList() {
            const listView = document.getElementById('listView');
            let htmlContent = '';
            
            const groupedData = currentFlatList.reduce((acc, word) => {
                if (!acc[word.group]) acc[word.group] = [];
                acc[word.group].push(word);
                return acc;
            }, {});

            for (const [groupName, groupWords] of Object.entries(groupedData)) {
                htmlContent += `
                    <div class="mb-6 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-blue-50 border-b border-blue-100 py-2.5 px-4 flex items-center">
                            <div class="w-2 h-2 rounded-full bg-blue-500 mr-2"></div>
                            <h2 class="text-sm font-bold text-blue-800">${groupName}</h2>
                        </div>
                        <div class="divide-y divide-slate-100">
                `;
                
                groupWords.forEach((item) => {
                    const id = `word-item-${globalWordIndex++}`;
                    htmlContent += `
                        <div>
                            <div class="p-4 flex justify-between items-center cursor-pointer hover:bg-slate-50 transition" onclick="toggleAccordion('${id}')">
                                <div class="pr-4">
                                    <h3 class="text-lg font-extrabold text-slate-800">${item.word}</h3>
                                    <p class="text-[0.9rem] font-medium text-slate-500 mt-0.5">${item.meaning}</p>
                                </div>
                                <div class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-400 flex-shrink-0">
                                    <i id="icon-${id}" class="fa-solid fa-chevron-down transition-transform duration-300 text-sm"></i>
                                </div>
                            </div>
                            
                            <div id="content-${id}" class="accordion-content bg-slate-50 px-5 border-t border-slate-100">
                                <div class="mb-2">
                                    <span class="inline-block bg-emerald-100 text-emerald-800 text-[10px] px-2 py-1 rounded-md font-bold mb-1.5 uppercase tracking-wide"><i class="fa-solid fa-seedling mr-1"></i> 메타인지 어원</span>
                                    <p class="text-[0.85rem] text-slate-700 leading-relaxed font-medium break-keep">${item.root}</p>
                                </div>
                                <div>
                                    <span class="inline-block bg-blue-100 text-blue-800 text-[10px] px-2 py-1 rounded-md font-bold mb-1.5 uppercase tracking-wide"><i class="fa-solid fa-link mr-1"></i> 동계어 (Family)</span>
                                    <p class="text-[0.85rem] text-slate-500 font-medium">${item.cognates}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });
                htmlContent += `</div></div>`;
            }
            listView.innerHTML = htmlContent;
            updateFlashcard();
        }

        // 아코디언 토글
        function toggleAccordion(id) {
            const content = document.getElementById(`content-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.classList.remove('rotate-180');
            } else {
                content.classList.add('open');
                icon.classList.add('rotate-180');
            }
        }

        // 사이드바 토글
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                overlay.classList.add('hidden');
            } else {
                sidebar.classList.add('open');
                overlay.classList.remove('hidden');
            }
        }

        // 플래시카드 모드 토글
        function toggleFlashcardMode() {
            if(currentFlatList.length === 0) return;
            
            const flashcardView = document.getElementById('flashcardView');
            const modeBtn = document.getElementById('modeToggleBtn');
            const listView = document.getElementById('listView');
            
            if (flashcardView.classList.contains('hidden')) {
                flashcardView.classList.remove('hidden');
                flashcardView.classList.add('flex');
                listView.classList.add('hidden');
                modeBtn.innerHTML = '<i class="fa-solid fa-list mr-1"></i> 목록보기';
                updateFlashcard();
            } else {
                flashcardView.classList.add('hidden');
                flashcardView.classList.remove('flex');
                listView.classList.remove('hidden');
                modeBtn.innerHTML = '<i class="fa-solid fa-clone mr-1"></i> 카드모드';
            }
        }

        // 플래시카드 내용 갱신
        function updateFlashcard() {
            if(currentFlatList.length === 0) return;
            const item = currentFlatList[currentCardIndex];
            
            document.getElementById('cardGroup').innerText = item.group;
            document.getElementById('cardWord').innerText = item.word;
            document.getElementById('cardWordBack').innerText = item.word;
            document.getElementById('cardMeaning').innerText = item.meaning;
            document.getElementById('cardRoot').innerText = item.root;
            document.getElementById('cardCognates').innerText = item.cognates;
            
            document.getElementById('flashcardCounter').innerText = `${currentCardIndex + 1} / ${currentFlatList.length}`;
            
            if(isFlipped) {
                document.getElementById('flashcard').classList.remove('rotate-y-180');
                isFlipped = false;
            }
        }

        // 카드 뒤집기
        function flipCard() {
            const card = document.getElementById('flashcard');
            isFlipped = !isFlipped;
            card.classList.toggle('rotate-y-180');
        }

        // 카드 이동 (이전/다음)
        function prevCard() {
            currentCardIndex = (currentCardIndex > 0) ? currentCardIndex - 1 : currentFlatList.length - 1;
            updateFlashcard();
        }

        function nextCard() {
            currentCardIndex = (currentCardIndex < currentFlatList.length - 1) ? currentCardIndex + 1 : 0;
            updateFlashcard();
        }

        // 초기 실행
        window.onload = () => {
            renderMenu();
            // loadLesson("중등 고난도", "1강 (가족/관계)", "menu-중등고난도-1강가족관계");
        };
    </script>
</body>
</html>
