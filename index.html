<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>어원 기반 모바일 단어장 (1~30강)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                        eng: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#10B981',
                        danger: '#EF4444',
                        surface: '#F9FAFB',
                        card: '#FFFFFF'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #e5e7eb;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .view {
            display: none;
            flex: 1;
            flex-direction: column;
            animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .view.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .flashcard-container {
            perspective: 1200px;
            width: 100%;
            height: 420px; /* 약간 높이 증가 */
        }
        .flashcard {
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border-radius: 1.5rem;
        }
        .flashcard.is-flipped { transform: rotateY(180deg); }
        
        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 1.5rem;
            padding: 1.5rem;
            text-align: center;
        }
        .flashcard-front { background-color: #ffffff; border: 2px solid #E5E7EB; }
        .flashcard-back { background-color: #F8FAFC; border: 2px solid #4F46E5; transform: rotateY(180deg); }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .floating-btn {
            position: sticky;
            bottom: 20px;
            width: calc(100% - 32px);
            margin: 0 auto;
            z-index: 40;
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">
        <header class="bg-gradient-to-r from-primary to-indigo-600 text-white p-4 sticky top-0 z-50 flex items-center shadow-md">
            <!-- 뒤로가기 버튼 클릭 이벤트 강화 -->
            <button id="btn-back" onclick="event.preventDefault(); goBack();" style="display: none;" class="mr-4 text-xl focus:outline-none w-12 h-12 flex items-center justify-center rounded-full bg-white/20 hover:bg-white/30 transition active:scale-95 z-[9999] relative">
                <i class="fas fa-arrow-left pointer-events-none"></i>
            </button>
            <h1 id="header-title" class="text-xl font-bold font-eng tracking-wide flex-1 text-center truncate">RootVoca <span class="text-sm font-normal text-indigo-200">고난도 완결</span></h1>
            <div class="w-12" id="header-spacer" style="display: none;"></div>
        </header>

        <main id="view-home" class="view active overflow-y-auto hide-scrollbar p-5 pb-20 bg-surface">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-2">학습하기</h2>
                <p class="text-gray-500 text-sm">원하는 강의를 선택하세요. (1강 ~ 30강 완벽 분류)</p>
            </div>
            <div id="lesson-list" class="space-y-4">
                <!-- JavaScript가 채움 -->
            </div>
        </main>

        <main id="view-lesson" class="view overflow-y-auto hide-scrollbar p-5 pb-24 bg-surface">
            <div class="mb-4 flex justify-between items-end">
                <div>
                    <h2 id="lesson-title-display" class="text-2xl font-bold text-gray-800">1강</h2>
                    <p id="lesson-word-count" class="text-gray-500 text-sm mt-1">총 0단어</p>
                </div>
            </div>
            
            <div id="root-groups-list" class="space-y-6 mb-8">
                <!-- JavaScript가 채움 -->
            </div>

            <div class="floating-btn">
                <button id="btn-start-test" class="w-full bg-primary text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-indigo-700 transition flex justify-center items-center">
                    <i class="fas fa-play mr-2"></i> 이 강의 테스트 시작
                </button>
            </div>
        </main>

        <main id="view-test" class="view flex-col p-5 bg-gray-50">
            <div class="flex justify-between items-center mb-6 bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                <div class="w-full bg-gray-200 rounded-full h-3 mr-4 overflow-hidden">
                    <div id="test-progress-bar" class="bg-primary h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <span id="test-progress-text" class="text-sm font-bold text-gray-600 whitespace-nowrap">0 / 0</span>
            </div>

            <div class="flex-1 flex flex-col justify-center items-center mb-6">
                <div class="flashcard-container" onclick="flipCard()">
                    <div id="flashcard" class="flashcard">
                        <div class="flashcard-face flashcard-front">
                            <div class="w-12 h-12 rounded-full bg-indigo-50 flex items-center justify-center mb-6">
                                <i class="fas fa-sync-alt text-primary opacity-50"></i>
                            </div>
                            <h2 id="card-en" class="text-4xl font-bold text-gray-800 font-eng mb-4 text-center">Word</h2>
                            <p class="text-sm text-gray-400 mt-4">터치하여 뒤집기</p>
                        </div>
                        <div class="flashcard-face flashcard-back overflow-y-auto hide-scrollbar flex flex-col justify-center items-center">
                            <h2 id="card-ko" class="text-3xl font-bold text-primary mb-5 break-keep text-center w-full">뜻</h2>
                            
                            <!-- 어원과 동계어가 완벽히 분리된 박스 형태 -->
                            <div class="w-full space-y-3 px-2">
                                <div class="bg-indigo-50/70 p-3 rounded-xl border border-indigo-100 flex flex-col items-start w-full">
                                    <span class="bg-indigo-100 text-indigo-700 text-[11px] font-bold px-2 py-1 rounded mb-2 flex items-center shadow-sm">
                                        <i class="fas fa-history mr-1.5"></i>어원
                                    </span>
                                    <p id="card-ety" class="text-[13px] text-gray-700 font-medium leading-relaxed text-left w-full"></p>
                                </div>
                                <div class="bg-emerald-50/70 p-3 rounded-xl border border-emerald-100 flex flex-col items-start w-full">
                                    <span class="bg-emerald-100 text-emerald-700 text-[11px] font-bold px-2 py-1 rounded mb-2 flex items-center shadow-sm">
                                        <i class="fas fa-project-diagram mr-1.5"></i>동계어
                                    </span>
                                    <p id="card-cog" class="text-[13px] text-gray-700 font-medium leading-relaxed text-left w-full"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 pb-4" id="test-controls" style="opacity: 0.4; pointer-events: none;">
                <button onclick="handleAnswer(false)" class="bg-white border-2 border-danger text-danger py-4 rounded-xl font-bold text-lg shadow-sm active:bg-red-50 flex items-center justify-center transition">
                    <i class="fas fa-times mr-2"></i> 몰라요
                </button>
                <button onclick="handleAnswer(true)" class="bg-white border-2 border-secondary text-secondary py-4 rounded-xl font-bold text-lg shadow-sm active:bg-green-50 flex items-center justify-center transition">
                    <i class="fas fa-circle mr-2 text-[10px]"></i> 알아요
                </button>
            </div>
            <p class="text-center text-xs text-gray-400 pb-2">카드를 뒤집으면 버튼이 활성화됩니다.</p>
        </main>

        <main id="view-result" class="view p-6 flex-col justify-center items-center text-center bg-white">
            <div class="w-24 h-24 bg-gradient-to-br from-indigo-100 to-primary/20 rounded-full flex items-center justify-center mb-6 shadow-inner">
                <i class="fas fa-trophy text-5xl text-primary drop-shadow-md"></i>
            </div>
            <h2 class="text-3xl font-bold text-gray-800 mb-2">학습 완료!</h2>
            <p class="text-gray-500 mb-8">이번 강의의 결과를 확인하세요.</p>
            
            <div class="w-full bg-surface p-6 rounded-2xl mb-8 flex justify-around border border-gray-100 shadow-sm">
                <div class="text-center">
                    <p class="text-sm text-gray-500 mb-2 font-medium">알아요</p>
                    <p id="result-correct" class="text-4xl font-bold text-secondary">0</p>
                </div>
                <div class="w-px bg-gray-200"></div>
                <div class="text-center">
                    <p class="text-sm text-gray-500 mb-2 font-medium">몰라요</p>
                    <p id="result-incorrect" class="text-4xl font-bold text-danger">0</p>
                </div>
            </div>

            <button onclick="goHome()" class="w-full bg-primary text-white py-4 rounded-xl font-bold text-lg shadow-md hover:bg-indigo-700 transition mb-3">
                다른 강의 학습하기
            </button>
            <button onclick="retryTest()" class="w-full bg-white border-2 border-gray-200 text-gray-700 py-4 rounded-xl font-bold text-lg shadow-sm hover:bg-gray-50 transition">
                틀린 단어만 다시 하기
            </button>
        </main>

        <!-- 커스텀 모달 (테스트 종료 확인) -->
        <div id="modal-confirm" class="fixed inset-0 z-[10000] flex items-center justify-center bg-black/60 hidden opacity-0 transition-opacity duration-300 pointer-events-none">
            <div class="bg-white rounded-2xl p-6 w-11/12 max-w-sm shadow-2xl transform scale-95 transition-transform duration-300 pointer-events-auto">
                <h3 class="text-xl font-bold text-gray-800 mb-2">테스트 종료</h3>
                <p class="text-gray-600 mb-6 text-sm">테스트를 중단하고 목록으로 돌아가시겠습니까?<br>진행 상황이 초기화됩니다.</p>
                <div class="flex space-x-3">
                    <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-700 font-bold hover:bg-gray-200 transition active:bg-gray-300">취소</button>
                    <button onclick="confirmExit()" class="flex-1 py-3 rounded-xl bg-danger text-white font-bold hover:bg-red-600 transition shadow-md shadow-red-200 active:bg-red-700">나가기</button>
                </div>
            </div>
        </div>

        <!-- 커스텀 알림 모달 -->
        <div id="modal-alert" class="fixed inset-0 z-[10000] flex items-center justify-center bg-black/60 hidden opacity-0 transition-opacity duration-300 pointer-events-none">
            <div class="bg-white rounded-2xl p-6 w-11/12 max-w-sm shadow-2xl transform scale-95 transition-transform duration-300 text-center pointer-events-auto">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-check text-2xl text-green-500"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">완벽합니다!</h3>
                <p class="text-gray-600 mb-6 text-sm">틀린 단어가 없습니다.</p>
                <button onclick="closeAlertModal()" class="w-full py-3 rounded-xl bg-primary text-white font-bold hover:bg-indigo-700 transition active:scale-95">확인</button>
            </div>
        </div>
    </div>

    <script>
        const vocaDB = [
            {
                lesson: "1강",
                groups: [
                    {
                        root: "삶, 양육, 가족 (Life & Nurture)",
                        words: [
                            { e: "lifespan", k: "일생, 생애", ety: "life(생명) + span(기간, 뼘)", cog: "alive(살아있는), expand(확장하다)" },
                            { e: "parent", k: "부모", ety: "parere(낳다) + ent(사람)", cog: "parenting(양육)" },
                            { e: "raise", k: "~을 기르다, 양육하다", ety: "위로 들어올리다 -> 기르다", cog: "rise(오르다)" },
                            { e: "bring up", k: "양육하다, 키우다", ety: "bring(가져오다) + up(위로) -> 길러내다", cog: "bring(가져오다)" },
                            { e: "nephew", k: "조카 (아들)", ety: "nepot-(손자, 조카)", cog: "nepotism(친족 등용)" },
                            { e: "daycare center", k: "탁아소, 보육원", ety: "day(낮) + care(돌보다) + center", cog: "careful(주의 깊은)" },
                            { e: "pregnancy", k: "임신", ety: "pre(미리) + gna(태어나다) + ncy", cog: "pregnant(임신한), nature(자연)" },
                            { e: "immature", k: "미숙한, 미발달의", ety: "im(부정) + mature(성숙한)", cog: "mature(성숙한)" },
                            { e: "older", k: "나이가 위인, 선배의", ety: "old(나이든)의 비교급", cog: "elder(나이가 더 많은)" }
                        ]
                    },
                    {
                        root: "행동, 상호작용 (Action & Interaction)",
                        words: [
                            { e: "act", k: "행동하다, 처신하다", ety: "agere(행동하다, 이끌다)", cog: "action(행동), active(활동적인)" },
                            { e: "behavior", k: "행동", ety: "be(강조) + have(가지다) -> 태도를 가지다", cog: "behave(행동하다)" },
                            { e: "interact with", k: "~와 상호 작용을 하다", ety: "inter(서로) + act(행동하다)", cog: "interaction(상호작용)" },
                            { e: "interaction", k: "상호 작용", ety: "inter(서로) + act + ion", cog: "active(활동적인)" },
                            { e: "communication", k: "연락, 의사소통", ety: "com(함께) + muni(나누다) + cation", cog: "community(공동체)" },
                            { e: "come into contact with", k: "~와 접촉하다, 만나다", ety: "con(함께) + tact(만지다)", cog: "contact(접촉)" },
                            { e: "touch", k: "접촉", ety: "가볍게 치다, 만지다", cog: "touching(감동적인)" },
                            { e: "take after", k: "~와 닮다", ety: "뒤를 따라 취하다 -> 닮다", cog: "after(~후에)" },
                            { e: "resemblance", k: "닮은 점, 유사점", ety: "re(강조) + semble(비슷한) + ance", cog: "assemble(모으다)" }
                        ]
                    },
                    {
                        root: "관계, 태도 (Relation & Attitude)",
                        words: [
                            { e: "marriage partner", k: "배우자, 남편, 아내", ety: "marriage(결혼) + partner(동반자)", cog: "marry(결혼하다)" },
                            { e: "engagement", k: "약혼; 약속", ety: "en(안으로) + gage(서약) + ment", cog: "engage(관여하다)" },
                            { e: "be engaged in", k: "~에 종사하다", ety: "engage(서약하다, 묶어두다)의 수동형", cog: "engagement(참여)" },
                            { e: "bond, association", k: "관계, 관련, 연관", ety: "bond(묶다) / ad(~로) + soci(동료) + ation", cog: "associate(연관시키다)" },
                            { e: "support", k: "지지하다, 옹호하다; 지지, 지원", ety: "sub(아래에서) + port(나르다)", cog: "porter(짐꾼)" },
                            { e: "obedience", k: "복종", ety: "ob(~를 향해) + audire(듣다) + ence", cog: "obey(복종하다), audience(청중)" },
                            { e: "disobedient", k: "반항적인", ety: "dis(반대) + obedient(복종하는)", cog: "obedient(순종적인)" },
                            { e: "advice", k: "충고", ety: "ad(~에) + vis(보다) -> 의견을 보여줌", cog: "advise(충고하다)" },
                            { e: "deal with", k: "다루다, 대우하다; 치료하다", ety: "deal(나누다, 처리하다) + with", cog: "dealer(상인)" },
                            { e: "treatment", k: "취급; 치료", ety: "treat(다루다) + ment", cog: "treat(다루다)" }
                        ]
                    },
                    {
                        root: "운명, 기념 (Destiny & Celebration)",
                        words: [
                            { e: "fatal", k: "치명적인; 운명의", ety: "fate(운명) + al", cog: "fate(운명)" },
                            { e: "destiny", k: "운명, 숙명", ety: "de(완전히) + stin(서다) -> 확고히 정해진 것", cog: "destination(목적지)" },
                            { e: "celebration", k: "기념, 축하", ety: "celebr(붐비는, 유명한) + ation", cog: "celebrity(유명인)" },
                            { e: "commemorate", k: "기념하다, 축하하다", ety: "com(함께) + memor(기억하다) + ate", cog: "memory(기억)" },
                            { e: "senior", k: "연장자, 선배", ety: "sen(나이든) + ior(더 ~한)", cog: "senate(상원)" },
                            { e: "escort", k: "동행하다, 함께 가다", ety: "ex(밖으로) + corrigere(인도하다)", cog: "correct(올바른)" }
                        ]
                    }
                ]
            },
            {
                lesson: "2강",
                groups: [
                    {
                        root: "성격, 태도 (Personality)",
                        words: [
                            { e: "active", k: "적극적인, 활동적인", ety: "act(행동) + ive", cog: "action(행동)" },
                            { e: "lively, energetic", k: "적극적인, 활동적인", ety: "live(살다)+ly / en(안에)+erg(일)+etic", cog: "energy(에너지)" },
                            { e: "passive", k: "소극적인", ety: "pass(고통받다) + ive -> 가만히 받는", cog: "passion(열정)" },
                            { e: "inactive", k: "소극적인, 수동적인", ety: "in(부정) + active(활동적인)", cog: "active(활동적인)" },
                            { e: "lazy", k: "게으른", ety: "나태한 (어원 불명확)", cog: "laziness(게으름)" },
                            { e: "boldness", k: "배짱", ety: "bold(대담한) + ness", cog: "bold(대담한)" },
                            { e: "arrogance", k: "오만, 거만, 불손", ety: "ad(~로) + rog(요구하다) + ance", cog: "arrogant(오만한)" },
                            { e: "proud, haughty", k: "오만한, 거만한", ety: "자랑스러운 / altus(높은)", cog: "pride(자부심)" },
                            { e: "humbleness", k: "겸손, 겸양", ety: "humus(땅) -> 땅에 엎드린 + ness", cog: "humble(겸손한)" },
                            { e: "modest", k: "겸손한", ety: "mod(척도) -> 적절한 선을 지키는", cog: "model(모델)" },
                            { e: "ambition", k: "야망, 포부", ety: "ambi(양쪽으로) + it(가다) + ion -> 표를 구하러 다님", cog: "ambitious(야심찬)" },
                            { e: "unambitious", k: "야망이 없는", ety: "un(부정) + ambitious", cog: "ambition(야망)" },
                            { e: "greedy", k: "탐욕스러운", ety: "greed(탐욕) + y", cog: "greed(탐욕)" },
                            { e: "impatience", k: "성급함", ety: "im(부정) + patience(인내)", cog: "patient(참을성있는)" },

        function navigate(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(`view-${viewName}`).classList.add('active');
            state.currentView = viewName;
            updateHeader();
            window.scrollTo(0,0);
        }

        function updateHeader() {
            const elBtnBack = document.getElementById('btn-back');
            const elHeaderSpacer = document.getElementById('header-spacer');
            
            if (state.currentView === 'home') {
                elHeaderTitle.innerHTML = 'RootVoca <span class="text-sm font-normal text-indigo-200">1~30강</span>';
                elBtnBack.style.display = 'none';
                elHeaderSpacer.style.display = 'none';
            } else {
                elBtnBack.style.display = 'flex';
                elHeaderSpacer.style.display = 'block';
                
                if (state.currentView === 'lesson') {
                    elHeaderTitle.textContent = vocaDB[state.currentLessonIndex].lesson;
                } else if (state.currentView === 'test') {
                    elHeaderTitle.textContent = '테스트 진행중';
                } else if (state.currentView === 'result') {
                    elHeaderTitle.textContent = '학습 결과';
                }
            }
        }

        function goBack() {
            if (state.currentView === 'lesson') {
                navigate('home');
            } else if (state.currentView === 'test') {
                showModal();
            } else if (state.currentView === 'result') {
                navigate('home');
            }
        }

        function showModal() {
            const modal = document.getElementById('modal-confirm');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.querySelector('div').classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('modal-confirm');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

            closeModal();
            setTimeout(() => {
                navigate('lesson');
            }, 300);
        }

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function startTest(wordsArray) {
            state.testQueue = shuffleArray(wordsArray);
            state.currentCardIndex = 0;
            state.correctCount = 0;
            state.incorrectQueue = [];
            
            navigate('test');
            renderFlashcard();
        }

        function retryTest() {
            if (state.incorrectQueue.length === 0) {
                showAlertModal();
                return;
            }
            startTest(state.incorrectQueue);
        }

        function showAlertModal() {
            const modal = document.getElementById('modal-alert');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.querySelector('div').classList.remove('scale-95');
            }, 10);
        }

        function closeAlertModal() {
            const modal = document.getElementById('modal-alert');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function renderFlashcard() {
            const word = state.testQueue[state.currentCardIndex];
            const flashcard = document.getElementById('flashcard');
            
            flashcard.classList.remove('is-flipped');
            
            const controls = document.getElementById('test-controls');
            controls.style.opacity = '0.4';
            controls.style.pointerEvents = 'none';

            setTimeout(() => {
                document.getElementById('card-en').textContent = word.e;
                document.getElementById('card-ko').textContent = word.k;
                document.getElementById('card-ety').textContent = word.ety;
                document.getElementById('card-cog').textContent = word.cog;
            }, 150);

            const progressPct = ((state.currentCardIndex) / state.testQueue.length) * 100;
            document.getElementById('test-progress-bar').style.width = `${progressPct}%`;
            document.getElementById('test-progress-text').textContent = `${state.currentCardIndex + 1} / ${state.testQueue.length}`;
        }

        function flipCard() {
            const flashcard = document.getElementById('flashcard');
            if (!flashcard.classList.contains('is-flipped')) {
                flashcard.classList.add('is-flipped');
                const controls = document.getElementById('test-controls');
                controls.style.opacity = '1';
                controls.style.pointerEvents = 'auto';
            }
        }

        function handleAnswer(isCorrect) {
            const currentWord = state.testQueue[state.currentCardIndex];
            
            if (isCorrect) {
                state.correctCount++;
            } else {
                state.incorrectQueue.push(currentWord);
            }

            state.currentCardIndex++;

            if (state.currentCardIndex >= state.testQueue.length) {
                document.getElementById('test-progress-bar').style.width = '100%';
                document.getElementById('test-progress-text').textContent = `${state.testQueue.length} / ${state.testQueue.length}`;
                setTimeout(() => {
                    showResults();
                }, 400);
            } else {
                renderFlashcard();
            }
        }

        function showResults() {
            document.getElementById('result-correct').textContent = state.correctCount;
            document.getElementById('result-incorrect').textContent = state.testQueue.length - state.correctCount;
            navigate('result');
        }

        function goHome() {
            navigate('home');
        }

        window.onload = () => {
            renderHome();
            navigate('home');
        };

    </script>
</body>
</html>
