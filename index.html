<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>어원 기반 모바일 단어장 (1~20강)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                        eng: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#10B981',
                        danger: '#EF4444',
                        surface: '#F9FAFB',
                        card: '#FFFFFF'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #e5e7eb;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .view {
            display: none;
            flex: 1;
            flex-direction: column;
            animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .view.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .flashcard-container {
            perspective: 1200px;
            width: 100%;
            height: 420px; /* 약간 높이 증가 */
        }
        .flashcard {
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border-radius: 1.5rem;
        }
        .flashcard.is-flipped { transform: rotateY(180deg); }
        
        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 1.5rem;
            padding: 1.5rem;
            text-align: center;
        }
        .flashcard-front { background-color: #ffffff; border: 2px solid #E5E7EB; }
        .flashcard-back { background-color: #F8FAFC; border: 2px solid #4F46E5; transform: rotateY(180deg); }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .floating-btn {
            position: sticky;
            bottom: 20px;
            width: calc(100% - 32px);
            margin: 0 auto;
            z-index: 40;
        }
    </style>
</head>
<body>

    <div class="app-container" id="app">
        <header class="bg-gradient-to-r from-primary to-indigo-600 text-white p-4 sticky top-0 z-50 flex items-center shadow-md">
            <!-- 뒤로가기 버튼 클릭 이벤트 강화 -->
            <button id="btn-back" onclick="event.preventDefault(); goBack();" style="display: none;" class="mr-4 text-xl focus:outline-none w-12 h-12 flex items-center justify-center rounded-full bg-white/20 hover:bg-white/30 transition active:scale-95 z-[9999] relative">
                <i class="fas fa-arrow-left pointer-events-none"></i>
            </button>
            <h1 id="header-title" class="text-xl font-bold font-eng tracking-wide flex-1 text-center truncate">RootVoca <span class="text-sm font-normal text-indigo-200">고난도 완결</span></h1>
            <div class="w-12" id="header-spacer" style="display: none;"></div>
        </header>

        <main id="view-home" class="view active overflow-y-auto hide-scrollbar p-5 pb-20 bg-surface">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-2">학습하기</h2>
                <p class="text-gray-500 text-sm">원하는 강의를 선택하세요. (1강 ~ 20강 완벽 분류)</p>
            </div>
            <div id="lesson-list" class="space-y-4">
                <!-- JavaScript가 채움 -->
            </div>
        </main>

        <main id="view-lesson" class="view overflow-y-auto hide-scrollbar p-5 pb-24 bg-surface">
            <div class="mb-4 flex justify-between items-end">
                <div>
                    <h2 id="lesson-title-display" class="text-2xl font-bold text-gray-800">1강</h2>
                    <p id="lesson-word-count" class="text-gray-500 text-sm mt-1">총 0단어</p>
                </div>
            </div>
            
            <div id="root-groups-list" class="space-y-6 mb-8">
                <!-- JavaScript가 채움 -->
            </div>

            <div class="floating-btn">
                <button id="btn-start-test" class="w-full bg-primary text-white py-4 rounded-xl font-bold text-lg shadow-lg hover:bg-indigo-700 transition flex justify-center items-center">
                    <i class="fas fa-play mr-2"></i> 이 강의 테스트 시작
                </button>
            </div>
        </main>

        <main id="view-test" class="view flex-col p-5 bg-gray-50">
            <div class="flex justify-between items-center mb-6 bg-white p-3 rounded-2xl shadow-sm border border-gray-100">
                <div class="w-full bg-gray-200 rounded-full h-3 mr-4 overflow-hidden">
                    <div id="test-progress-bar" class="bg-primary h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <span id="test-progress-text" class="text-sm font-bold text-gray-600 whitespace-nowrap">0 / 0</span>
            </div>

            <div class="flex-1 flex flex-col justify-center items-center mb-6">
                <div class="flashcard-container" onclick="flipCard()">
                    <div id="flashcard" class="flashcard">
                        <div class="flashcard-face flashcard-front">
                            <div class="w-12 h-12 rounded-full bg-indigo-50 flex items-center justify-center mb-6">
                                <i class="fas fa-sync-alt text-primary opacity-50"></i>
                            </div>
                            <h2 id="card-en" class="text-4xl font-bold text-gray-800 font-eng mb-4 text-center">Word</h2>
                            <p class="text-sm text-gray-400 mt-4">터치하여 뒤집기</p>
                        </div>
                        <div class="flashcard-face flashcard-back overflow-y-auto hide-scrollbar flex flex-col justify-center items-center">
                            <h2 id="card-ko" class="text-3xl font-bold text-primary mb-5 break-keep text-center w-full">뜻</h2>
                            
                            <!-- 어원과 동계어가 완벽히 분리된 박스 형태 -->
                            <div class="w-full space-y-3 px-2">
                                <div class="bg-indigo-50/70 p-3 rounded-xl border border-indigo-100 flex flex-col items-start w-full">
                                    <span class="bg-indigo-100 text-indigo-700 text-[11px] font-bold px-2 py-1 rounded mb-2 flex items-center shadow-sm">
                                        <i class="fas fa-history mr-1.5"></i>어원
                                    </span>
                                    <p id="card-ety" class="text-[13px] text-gray-700 font-medium leading-relaxed text-left w-full"></p>
                                </div>
                                <div class="bg-emerald-50/70 p-3 rounded-xl border border-emerald-100 flex flex-col items-start w-full">
                                    <span class="bg-emerald-100 text-emerald-700 text-[11px] font-bold px-2 py-1 rounded mb-2 flex items-center shadow-sm">
                                        <i class="fas fa-project-diagram mr-1.5"></i>동계어
                                    </span>
                                    <p id="card-cog" class="text-[13px] text-gray-700 font-medium leading-relaxed text-left w-full"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 pb-4" id="test-controls" style="opacity: 0.4; pointer-events: none;">
                <button onclick="handleAnswer(false)" class="bg-white border-2 border-danger text-danger py-4 rounded-xl font-bold text-lg shadow-sm active:bg-red-50 flex items-center justify-center transition">
                    <i class="fas fa-times mr-2"></i> 몰라요
                </button>
                <button onclick="handleAnswer(true)" class="bg-white border-2 border-secondary text-secondary py-4 rounded-xl font-bold text-lg shadow-sm active:bg-green-50 flex items-center justify-center transition">
                    <i class="fas fa-circle mr-2 text-[10px]"></i> 알아요
                </button>
            </div>
            <p class="text-center text-xs text-gray-400 pb-2">카드를 뒤집으면 버튼이 활성화됩니다.</p>
        </main>

        <main id="view-result" class="view p-6 flex-col justify-center items-center text-center bg-white">
            <div class="w-24 h-24 bg-gradient-to-br from-indigo-100 to-primary/20 rounded-full flex items-center justify-center mb-6 shadow-inner">
                <i class="fas fa-trophy text-5xl text-primary drop-shadow-md"></i>
            </div>
            <h2 class="text-3xl font-bold text-gray-800 mb-2">학습 완료!</h2>
            <p class="text-gray-500 mb-8">이번 강의의 결과를 확인하세요.</p>
            
            <div class="w-full bg-surface p-6 rounded-2xl mb-8 flex justify-around border border-gray-100 shadow-sm">
                <div class="text-center">
                    <p class="text-sm text-gray-500 mb-2 font-medium">알아요</p>
                    <p id="result-correct" class="text-4xl font-bold text-secondary">0</p>
                </div>
                <div class="w-px bg-gray-200"></div>
                <div class="text-center">
                    <p class="text-sm text-gray-500 mb-2 font-medium">몰라요</p>
                    <p id="result-incorrect" class="text-4xl font-bold text-danger">0</p>
                </div>
            </div>

            <button onclick="goHome()" class="w-full bg-primary text-white py-4 rounded-xl font-bold text-lg shadow-md hover:bg-indigo-700 transition mb-3">
                다른 강의 학습하기
            </button>
            <button onclick="retryTest()" class="w-full bg-white border-2 border-gray-200 text-gray-700 py-4 rounded-xl font-bold text-lg shadow-sm hover:bg-gray-50 transition">
                틀린 단어만 다시 하기
            </button>
        </main>

        <!-- 커스텀 모달 (테스트 종료 확인) -->
        <div id="modal-confirm" class="fixed inset-0 z-[10000] flex items-center justify-center bg-black/60 hidden opacity-0 transition-opacity duration-300 pointer-events-none">
            <div class="bg-white rounded-2xl p-6 w-11/12 max-w-sm shadow-2xl transform scale-95 transition-transform duration-300 pointer-events-auto">
                <h3 class="text-xl font-bold text-gray-800 mb-2">테스트 종료</h3>
                <p class="text-gray-600 mb-6 text-sm">테스트를 중단하고 목록으로 돌아가시겠습니까?<br>진행 상황이 초기화됩니다.</p>
                <div class="flex space-x-3">
                    <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-gray-100 text-gray-700 font-bold hover:bg-gray-200 transition active:bg-gray-300">취소</button>
                    <button onclick="confirmExit()" class="flex-1 py-3 rounded-xl bg-danger text-white font-bold hover:bg-red-600 transition shadow-md shadow-red-200 active:bg-red-700">나가기</button>
                </div>
            </div>
        </div>

        <!-- 커스텀 알림 모달 -->
        <div id="modal-alert" class="fixed inset-0 z-[10000] flex items-center justify-center bg-black/60 hidden opacity-0 transition-opacity duration-300 pointer-events-none">
            <div class="bg-white rounded-2xl p-6 w-11/12 max-w-sm shadow-2xl transform scale-95 transition-transform duration-300 text-center pointer-events-auto">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-check text-2xl text-green-500"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">완벽합니다!</h3>
                <p class="text-gray-600 mb-6 text-sm">틀린 단어가 없습니다.</p>
                <button onclick="closeAlertModal()" class="w-full py-3 rounded-xl bg-primary text-white font-bold hover:bg-indigo-700 transition active:scale-95">확인</button>
            </div>
        </div>
    </div>

    <script>
        const vocaDB = [
            {
                lesson: "1강",
                groups: [
                    {
                        root: "act, ag (행동하다, 작용하다)",
                        words: [
                            { e: "act", k: "행동하다, 처신하다", ety: "agere(행동하다, 이끌다)", cog: "active(활동적인), agent(대리인)" },
                            { e: "interaction", k: "상호 작용", ety: "inter(사이에) + act(행동) + ion", cog: "interactive(상호작용하는), react(반응하다)" },
                            { e: "interact with", k: "~와 상호 작용을 하다", ety: "inter(사이에) + act(행동)", cog: "interaction(상호작용)" },
                            { e: "behavior", k: "행동", ety: "be(강조) + have(가지다) -> 처신하다", cog: "behave(행동하다)" }
                        ]
                    },
                    {
                        root: "생애, 탄생, 관계",
                        words: [
                            { e: "lifespan", k: "일생, 생애", ety: "life(생명) + span(기간, 늘이다)", cog: "alive(살아있는), expand(늘이다)" },
                            { e: "pregnancy", k: "임신", ety: "pre(미리) + gnasci(태어나다)", cog: "pregnant(임신한), nature(자연, 본성)" },
                            { e: "older", k: "나이가 위인, 선배의", ety: "old(나이든)의 비교급", cog: "elder(손위의), oldest(가장 나이든)" },
                            { e: "immature", k: "미숙한, 미발달의", ety: "im(부정) + mature(성숙한)", cog: "mature(성숙한), maturity(성숙)" },
                            { e: "senior", k: "연장자, 선배", ety: "sen(늙은) + ior(더 ~한)", cog: "senate(상원), senile(노망난)" },
                            { e: "nephew", k: "조카 (아들)", ety: "neops(조카, 손자)", cog: "nepotism(친족 등용)" }
                        ]
                    },
                    {
                        root: "양육, 돌봄",
                        words: [
                            { e: "daycare center", k: "탁아소, 보육원", ety: "day(낮) + care(돌봄) + center(중심)", cog: "careful(주의깊은), central(중심의)" },
                            { e: "raise", k: "~을 기르다, 양육하다", ety: "reisa(위로 들어올리다)", cog: "rise(오르다), arise(발생하다)" },
                            { e: "raise, bring up", k: "양육하다, 키우다", ety: "위로(up) 끌어올리다(bring)", cog: "upbringing(가정교육)" },
                            { e: "parent", k: "부모", ety: "parire(낳다, 생산하다)", cog: "parenting(육아)" }
                        ]
                    },
                    {
                        root: "결합, 동반, 약속",
                        words: [
                            { e: "marriage partner", k: "배우자, 남편, 아내", ety: "marry(결혼하다) + part(나누다)", cog: "marital(결혼의), partial(부분적인)" },
                            { e: "engagement", k: "약혼; 약속", ety: "en(안으로) + gage(서약, 저당) + ment", cog: "engage(관여하다, 약혼하다)" },
                            { e: "be engaged in", k: "~에 종사하다", ety: "en(안으로) + gage(서약) -> 묶여있다", cog: "engaging(매력적인)" },
                            { e: "escort", k: "동행하다, 함께 가다", ety: "ex(밖으로) + corrigere(인도하다)", cog: "correct(올바른, 정정하다)" },
                            { e: "bond, association", k: "관계, 관련, 연관", ety: "bind(묶다) / ad(~에) + soc(결합하다)", cog: "bind(묶다), associate(연관짓다), social(사회의)" }
                        ]
                    },
                    {
                        root: "소통, 조언, 유사성",
                        words: [
                            { e: "communication", k: "연락", ety: "communis(공통의) + ation", cog: "communicate(소통하다), common(공통의)" },
                            { e: "advice", k: "충고", ety: "ad(~를 향해) + vis(보다) -> 견해를 주다", cog: "advise(충고하다), vision(시야)" },
                            { e: "resemblance", k: "닮은 점, 유사점", ety: "re(다시) + simul(비슷한) + ance", cog: "resemble(닮다), similar(비슷한)" },
                            { e: "take after", k: "~와 닮다", ety: "뒤(after)를 따르다(take)", cog: "afterward(나중에)" }
                        ]
                    },
                    {
                        root: "접촉, 다룸, 운명",
                        words: [
                            { e: "come into contact with", k: "~와 접촉하다, 만나다", ety: "con(함께) + tang(만지다)", cog: "contact(접촉), tactile(촉각의)" },
                            { e: "touch", k: "접촉", ety: "toccare(부딪히다, 만지다)", cog: "touching(감동적인)" },
                            { e: "deal with", k: "다루다, 대우하다; 치료하다", ety: "deal(나누다, 분배하다)", cog: "dealer(상인)" },
                            { e: "treatment", k: "취급; 치료", ety: "tractare(다루다, 끌다) + ment", cog: "treat(다루다), abstract(추상적인)" },
                            { e: "destiny", k: "운명, 숙명", ety: "de(완전히) + stina(고정시키다)", cog: "destination(목적지)" },
                            { e: "fatal", k: "치명적인; 운명의", ety: "fatum(운명) + al", cog: "fate(운명), fatality(사망자)" }
                        ]
                    },
                    {
                        root: "기타 동사/명사 (복종, 지지 등)",
                        words: [
                            { e: "obedience", k: "복종", ety: "ob(향하여) + audire(듣다)", cog: "obey(복종하다), audience(청중)" },
                            { e: "disobedient", k: "반항적인", ety: "dis(반대) + obedient(순종하는)", cog: "disobey(불복종하다)" },
                            { e: "support", k: "지지하다, 옹호하다; 지지", ety: "sub(아래에서) + port(나르다)", cog: "portable(휴대용의), export(수출하다)" },
                            { e: "commemorate", k: "기념하다, 축하하다", ety: "com(함께) + memor(기억하다)", cog: "memory(기억), memorial(기념비)" },
                            { e: "celebration", k: "기념, 축하", ety: "celeber(유명한, 붐비는)", cog: "celebrate(축하하다), celebrity(유명인)" }
                        ]
                    }
                ]
            },
            {
                lesson: "2강",
                groups: [
                    {
                        root: "act (행동) vs pass (인내, 수동)",
                        words: [
                            { e: "act", k: "행동하다", ety: "agere(행동하다)", cog: "action(행동), active(활동적인)" },
                            { e: "activity", k: "활동", ety: "act + ive + ity", cog: "activate(활성화하다)" },
                            { e: "active", k: "매우 적극적인, 활동적인", ety: "act + ive", cog: "actor(배우)" },
                            { e: "inactive", k: "소극적인, 수동적인", ety: "in(부정) + active", cog: "inactivity(비활동)" },
                            { e: "passive", k: "소극적인", ety: "pass(고통받다, 수용하다) + ive", cog: "passion(열정), compassion(동정)" },
                            { e: "patient", k: "참을성 있는", ety: "pati(고통받다) -> 견디는", cog: "patience(인내), impatient(성급한)" },
                            { e: "impatience", k: "성급함", ety: "im(부정) + patience(인내)", cog: "impatient(참을성없는)" },
                            { e: "impatiently", k: "성급하게", ety: "impatient + ly", cog: "patience(인내)" }
                        ]
                    },
                    {
                        root: "외모, 형태, 인상 (Appearance & Form)",
                        words: [
                            { e: "form", k: "모양, 꼴, 모습", ety: "forma(형태)", cog: "formal(공식적인), format(형식)" },

                            { e: "cabinet council", k: "각료 회의, 국무 회의", ety: "cabinet(작은방, 내각) + council(회의)", cog: "cabinet(내각, 보관장)" },
                            { e: "office", k: "사무실; 공직, 관직", ety: "opus(일) + fic(만들다) -> 일하는 곳/자리", cog: "official(공식적인)" },
                            { e: "officiate", k: "공무를 수행하다", ety: "office + iate", cog: "officer(장교, 공무원)" },
                            { e: "sessional", k: "개정 중의, 회기마다의", ety: "sess(앉다) + ion(회의) + al", cog: "session(회의, 기간)" },
                            { e: "elective", k: "선거의", ety: "e(밖으로) + lect(고르다) + ive", cog: "elect(선출하다)" },
                            { e: "election", k: "선거", ety: "e(밖으로) + lect(고르다) + ion", cog: "select(선택하다)" },
                            { e: "progressive", k: "진보적인", ety: "pro(앞으로) + gress(가다) + ive", cog: "progress(전진)" },
                            { e: "conservatism", k: "보수주의", ety: "con(함께) + serv(지키다) + atism", cog: "conserve(보존하다)" },
                            { e: "unionize", k: "연합하다", ety: "uni(하나) + on + ize(만들다)", cog: "union(조합, 연합)" }
                        ]
                    },
                    {
                        root: "권위, 명령 (Authority & Order)",
                        words: [
                            { e: "commander", k: "지휘관, 사령관", ety: "com(강조) + mand(명령하다) + er", cog: "command(명령하다)" },
                            { e: "power", k: "권위, 권한", ety: "할 수 있는 힘", cog: "powerful(강력한)" },
                            { e: "lead", k: "(군대 등을) 지휘하다", ety: "이끌다", cog: "leader(지도자)" },
                            { e: "order", k: "명령하다", ety: "순서, 질서, 명령", cog: "ordinary(보통의)" },
                            { e: "demand", k: "요구하다, 고집하다", ety: "de(완전히) + mand(명령하다)", cog: "command(명령하다)" },
                            { e: "allow", k: "찬성하다, 승인하다", ety: "ad(~에) + laud(칭찬하다) -> 허락하다", cog: "allowance(수당)" },
                            { e: "approval", k: "찬성, 승인", ety: "ap(~에) + prov(증명하다) + al -> 좋다고 인정함", cog: "approve(승인하다)" },
                            { e: "achievement", k: "업적", ety: "achieve(성취하다) + ment", cog: "achieve(성취하다)" },
                            { e: "fame", k: "명성, 덕망", ety: "fama(소문)", cog: "famous(유명한)" },
                            { e: "reputational", k: "명성의, 평판의", ety: "reputation(명성) + al", cog: "reputation(명성)" }
                        ]
                    },
                    {
                        root: "주장, 설득 (Argument & Persuasion)",
                        words: [
                            { e: "persuade", k: "(설득하여) 납득시키다", ety: "per(완전히) + suad(권고하다)", cog: "persuasion(설득)" },
                            { e: "persuasion", k: "설득", ety: "persuade의 명사형", cog: "persuasive(설득력있는)" },
                            { e: "argue", k: "논쟁하다", ety: "arg(빛나다, 분명히하다) -> 이유를 밝히다", cog: "argument(논쟁)" },
                            { e: "argument", k: "논쟁", ety: "argue + ment", cog: "argue(주장하다)" },
                            { e: "assure", k: "확신시키다", ety: "ad(~에) + sure(확실한)", cog: "sure(확실한)" },
                            { e: "conviction", k: "확신", ety: "con(완전히) + vict(이기다) + ion", cog: "convince(납득시키다)" },
                            { e: "declaration", k: "선언, 신고(서)", ety: "declare(선언하다) + ation", cog: "declare(선언하다)" },
                            { e: "announce", k: "선언하다, 공표하다", ety: "ad(~에게) + nounc(알리다)", cog: "announcement(발표)" },
                            { e: "insistent", k: "강요하는, 끈질긴", ety: "in(안에) + sist(서다) + ent -> 굳게 버티는", cog: "insist(주장하다)" },
                            { e: "with insistence", k: "끈질기게, 집요하게", ety: "insistence(고집)을 가지고", cog: "insist(주장하다)" }
                        ]
                    },
                    {
                        root: "대립, 태도 (Conflict & Attitude)",
                        words: [
                            { e: "hostility", k: "적의, 적개심", ety: "hostile(적대적인) + ity", cog: "hostile(적대적인)" },
                            { e: "unfriendly", k: "적대적인", ety: "un(부정) + friendly(친절한)", cog: "friend(친구)" },
                            { e: "friendly", k: "친절한", ety: "friend(친구) + ly", cog: "friendship(우정)" },
                            { e: "unconcerned", k: "무관심한", ety: "un(부정) + concern(관심) + ed", cog: "concern(관심)" },
                            { e: "indifference", k: "무관심", ety: "in(부정) + difference(차이) -> 차이가 없다고 느낌", cog: "different(다른)" },
                            { e: "resist", k: "반대하다, 대항하다", ety: "re(뒤로, 대항하여) + sist(서다)", cog: "resistance(저항)" },
                            { e: "opposite", k: "반대편의", ety: "ob(반대하여) + pos(놓다) + ite", cog: "oppose(반대하다)" },
                            { e: "divide, split", k: "나누다, 분열시키다", ety: "둘 이상으로 쪼개다", cog: "division(분할)" },
                            { e: "action, conduct", k: "행위", ety: "행동 / con(함께)+duct(이끌다)", cog: "active(활동적인), conductor(지휘자)" },
                            { e: "instant", k: "즉각적인", ety: "in(안에) + stans(서있는) -> 가까이 다가온", cog: "instantly(즉시)" },
                            { e: "immediately", k: "즉시; 직접", ety: "im(부정) + mediate(중간의) + ly", cog: "medium(중간)" },
                            { e: "put off, delay", k: "연기하다, 미루다", ety: "뒤로 미뤄두다", cog: "delay(지연)" },
                            { e: "assumption", k: "가정, 가설", ety: "assume(가정하다) + ption", cog: "assume(가정하다)" },
                            { e: "suppose", k: "추측하다, 가정하다", ety: "sup(아래에) + pos(놓다)", cog: "propose(제안하다)" },
                            { e: "assuming[supposing] that", k: "~라고 가정하면", ety: "assume/suppose 활용 구문", cog: "assume(가정하다)" },
                            { e: "nearest", k: "직접적인, 가장 가까운", ety: "near(가까운)의 최상급", cog: "near(가까운)" }
                        ]
                    }
                ]
            }
        ];

        let state = {
            currentView: 'home',
            currentLessonIndex: -1,
            testQueue: [],
            currentCardIndex: 0,
            correctCount: 0,
            incorrectQueue: []
        };

        const elApp = document.getElementById('app');
        const elHeaderTitle = document.getElementById('header-title');
        
        const viewHome = document.getElementById('view-home');
        const viewLesson = document.getElementById('view-lesson');
        const viewTest = document.getElementById('view-test');
        const viewResult = document.getElementById('view-result');

        function navigate(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(`view-${viewName}`).classList.add('active');
            state.currentView = viewName;
            updateHeader();
            window.scrollTo(0,0);
        }

        function updateHeader() {
            const elBtnBack = document.getElementById('btn-back');
            const elHeaderSpacer = document.getElementById('header-spacer');
            
            if (state.currentView === 'home') {
                elHeaderTitle.innerHTML = 'RootVoca <span class="text-sm font-normal text-indigo-200">1~20강</span>';
                elBtnBack.style.display = 'none';
                elHeaderSpacer.style.display = 'none';
            } else {
                elBtnBack.style.display = 'flex';
                elHeaderSpacer.style.display = 'block';
                
                if (state.currentView === 'lesson') {
                    elHeaderTitle.textContent = vocaDB[state.currentLessonIndex].lesson;
                } else if (state.currentView === 'test') {
                    elHeaderTitle.textContent = '테스트 진행중';
                } else if (state.currentView === 'result') {
                    elHeaderTitle.textContent = '학습 결과';
                }
            }
        }

        function goBack() {
            if (state.currentView === 'lesson') {
                navigate('home');
            } else if (state.currentView === 'test') {
                showModal();
            } else if (state.currentView === 'result') {
                navigate('home');
            }
        }

        function showModal() {
            const modal = document.getElementById('modal-confirm');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.querySelector('div').classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('modal-confirm');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function confirmExit() {
            closeModal();
            setTimeout(() => {
                navigate('lesson');
            }, 300);
        }

        function renderHome() {
            const lessonList = document.getElementById('lesson-list');
            lessonList.innerHTML = '';
            
            vocaDB.forEach((lessonData, index) => {
                let wordCount = 0;
                lessonData.groups.forEach(g => wordCount += g.words.length);

                const card = document.createElement('div');
                card.className = 'bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center cursor-pointer active:bg-gray-50 transition transform active:scale-[0.98]';
                card.onclick = () => openLessonView(index);
                
                card.innerHTML = `
                    <div class="flex items-center">
                        <div class="w-12 h-12 bg-indigo-50 rounded-xl flex items-center justify-center mr-4 text-primary font-bold text-lg shadow-sm border border-indigo-100">
                            ${index + 1}
                        </div>
                        <div>
                            <h3 class="font-bold text-lg text-gray-800">${lessonData.lesson}</h3>
                            <p class="text-gray-500 text-sm mt-0.5">어원 테마 ${lessonData.groups.length}개</p>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <span class="bg-gray-100 text-gray-600 text-xs font-bold px-3 py-1.5 rounded-lg mr-3">${wordCount}단어</span>
                        <i class="fas fa-chevron-right text-gray-300"></i>
                    </div>
                `;
                lessonList.appendChild(card);
            });
        }

        function openLessonView(index) {
            state.currentLessonIndex = index;
            const lessonData = vocaDB[index];
            
            document.getElementById('lesson-title-display').textContent = lessonData.lesson;
            
            let totalWords = 0;
            const groupsList = document.getElementById('root-groups-list');
            groupsList.innerHTML = '';
            
            let allWordsInLesson = [];

            lessonData.groups.forEach(group => {
                totalWords += group.words.length;
                allWordsInLesson = allWordsInLesson.concat(group.words);

                const groupContainer = document.createElement('div');
                groupContainer.className = 'bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-5';
                
                const groupHeader = document.createElement('div');
                groupHeader.className = 'bg-indigo-50/80 px-4 py-3 border-b border-indigo-100';
                groupHeader.innerHTML = `<h3 class="font-bold text-primary text-[15px] tracking-wide"><i class="fas fa-folder-open mr-2 opacity-60"></i>${group.root}</h3>`;
                groupContainer.appendChild(groupHeader);

                const wordListContainer = document.createElement('div');
                wordListContainer.className = 'divide-y divide-gray-50';

                group.words.forEach(word => {
                    const wordEl = document.createElement('div');
                    wordEl.className = 'p-4 hover:bg-gray-50 transition';
                    // 어원과 동계어 박스를 UI에서 명확히 분리
                    wordEl.innerHTML = `
                        <div class="mb-3">
                            <h4 class="text-lg font-bold text-gray-800 font-eng leading-tight">${word.e}</h4>
                            <p class="text-gray-700 font-medium text-sm mt-1">${word.k}</p>
                        </div>
                        <div class="space-y-2">
                            <div class="bg-indigo-50/60 p-2.5 rounded-lg border border-indigo-100 flex items-start">
                                <span class="bg-indigo-100 text-indigo-700 text-[10px] font-bold px-1.5 py-0.5 rounded mr-2 whitespace-nowrap mt-0.5 border border-indigo-200">어원</span>
                                <p class="text-xs text-gray-600 leading-snug break-keep flex-1">${word.ety}</p>
                            </div>
                            <div class="bg-emerald-50/60 p-2.5 rounded-lg border border-emerald-100 flex items-start">
                                <span class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-1.5 py-0.5 rounded mr-2 whitespace-nowrap mt-0.5 border border-emerald-200">동계</span>
                                <p class="text-xs text-gray-600 leading-snug break-keep flex-1">${word.cog}</p>
                            </div>
                        </div>
                    `;
                    wordListContainer.appendChild(wordEl);
                });

                groupContainer.appendChild(wordListContainer);
                groupsList.appendChild(groupContainer);
            });

            document.getElementById('lesson-word-count').textContent = `총 ${totalWords}단어`;
            document.getElementById('btn-start-test').onclick = () => startTest(allWordsInLesson);
            
            navigate('lesson');
        }

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function startTest(wordsArray) {
            state.testQueue = shuffleArray(wordsArray);
            state.currentCardIndex = 0;
            state.correctCount = 0;
            state.incorrectQueue = [];
            
            navigate('test');
            renderFlashcard();
        }

        function retryTest() {
            if (state.incorrectQueue.length === 0) {
                showAlertModal();
                return;
            }
            startTest(state.incorrectQueue);
        }

        function showAlertModal() {
            const modal = document.getElementById('modal-alert');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.querySelector('div').classList.remove('scale-95');
            }, 10);
        }

        function closeAlertModal() {
            const modal = document.getElementById('modal-alert');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function renderFlashcard() {
            const word = state.testQueue[state.currentCardIndex];
            const flashcard = document.getElementById('flashcard');
            
            flashcard.classList.remove('is-flipped');
            
            const controls = document.getElementById('test-controls');
            controls.style.opacity = '0.4';
            controls.style.pointerEvents = 'none';

            setTimeout(() => {
                document.getElementById('card-en').textContent = word.e;
                document.getElementById('card-ko').textContent = word.k;
                document.getElementById('card-ety').textContent = word.ety;
                document.getElementById('card-cog').textContent = word.cog;
            }, 150);

            const progressPct = ((state.currentCardIndex) / state.testQueue.length) * 100;
            document.getElementById('test-progress-bar').style.width = `${progressPct}%`;
            document.getElementById('test-progress-text').textContent = `${state.currentCardIndex + 1} / ${state.testQueue.length}`;
        }

        function flipCard() {
            const flashcard = document.getElementById('flashcard');
            if (!flashcard.classList.contains('is-flipped')) {
                flashcard.classList.add('is-flipped');
                const controls = document.getElementById('test-controls');
                controls.style.opacity = '1';
                controls.style.pointerEvents = 'auto';
            }
        }

        function handleAnswer(isCorrect) {
            const currentWord = state.testQueue[state.currentCardIndex];
            
            if (isCorrect) {
                state.correctCount++;
            } else {
                state.incorrectQueue.push(currentWord);
            }

            state.currentCardIndex++;

            if (state.currentCardIndex >= state.testQueue.length) {
                document.getElementById('test-progress-bar').style.width = '100%';
                document.getElementById('test-progress-text').textContent = `${state.testQueue.length} / ${state.testQueue.length}`;
                setTimeout(() => {
                    showResults();
                }, 400);
            } else {
                renderFlashcard();
            }
        }

        function showResults() {
            document.getElementById('result-correct').textContent = state.correctCount;
            document.getElementById('result-incorrect').textContent = state.testQueue.length - state.correctCount;
            navigate('result');
        }

        function goHome() {
            navigate('home');
        }

        window.onload = () => {
            renderHome();
            navigate('home');
        };

    </script>
</body>
</html>
